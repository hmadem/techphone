<div class="login-container">
  <div class="login-card">
    <h1>TechPhone</h1>
    <p>Admin Login</p>
    <form (submit)="connecter($event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" [formField]="loginForm.email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" [formField]="loginForm.motDePasse">
      </div>
      @if (erreur()) {
      <p class="error">{{ erreur() }}</p>
      }
      <button type="submit">Se connecter</button>
    </form>
  </div>
</div>
