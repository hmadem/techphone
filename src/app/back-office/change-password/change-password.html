
<div class="form-container">
  <h1>Changer le mot de passe</h1>
  <form >
    <div class="form-group">
      <label>Ancien mot de passe</label>
      <input type="password" [formField]="passwordForm.ancienMotDePasse">
    </div>

    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" [formField]="passwordForm.nouveauMotDePasse">
    </div>

    <div class="form-group">
      <label>Confirmer le nouveau mot de passe</label>
      <input type="password" [formField]="passwordForm.confirmerMotDePasse">
    </div>

    @if (erreur()) {
      <p class="error">{{ erreur() }}</p>
    }
    @if (message()) {
      <p class="success">{{ message() }}</p>
    }
    <input type="button" class="c1" value="Modifier le mot de passe" (click)="changerMotDePasse() ">
  </form>
</div>
